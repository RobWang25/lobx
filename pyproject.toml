# Builds lobx with its optional C++ core, lobx._core.
#
# Development install, after changing C++ code too:
#   .venv/bin/python -m pip install --no-build-isolation -e .
#
# The pure Python engine doesn't need this. It runs straight from the source tree.

[build-system]
requires = ["scikit-build-core==1.1.2", "nanobind==3.1.0"]
build-backend = "scikit_build_core.build"

[project]
name = "lobx"
version = "0.2.0"
description = "Limit order book exchange with an optional C++ matching core"
requires-python = ">=3.14"

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.source-dir = "cpp"
cmake.build-type = "Release"
build-dir = "build/python/{wheel_tag}"
wheel.packages = ["lobx"]
