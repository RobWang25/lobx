<!DOCTYPE html>
<html>
<head>
    <title>WebSocket Test</title>
</head>
<body>
    <h1>Trading Exchange WebSocket Test</h1>
    <div id="status">Disconnected</div>
    <button onclick="connect()">Connect</button>
    <button onclick="disconnect()">Disconnect</button>
    <div id="messages" style="border: 1px solid #ccc; padding: 10px; margin-top: 10px; height: 400px; overflow-y: scroll;">
    </div>

    <script>
        let ws = null;

        function connect() {
            ws = new WebSocket('ws://localhost:8000/ws/market');
            
            ws.onopen = function() {
                document.getElementById('status').textContent = '✅ Connected';
                document.getElementById('status').style.color = 'green';
                addMessage('Connected to market feed');
            };
            
            ws.onmessage = function(event) {
                const data = JSON.parse(event.data);
                addMessage('Received: ' + JSON.stringify(data, null, 2));
            };
            
            ws.onerror = function(error) {
                addMessage('❌ Error: ' + error);
            };
            
            ws.onclose = function() {
                document.getElementById('status').textContent = '❌ Disconnected';
                document.getElementById('status').style.color = 'red';
                addMessage('Disconnected from market feed');
            };
        }

        function disconnect() {
            if (ws) {
                ws.close();
            }
        }

        function addMessage(msg) {
            const div = document.createElement('div');
            div.textContent = new Date().toLocaleTimeString() + ' - ' + msg;
            div.style.marginBottom = '5px';
            document.getElementById('messages').appendChild(div);
            document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
        }
    </script>
</body>
</html>
