<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading Exchange - Mobile</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: #1a1a1a;
            color: #fff;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 20px;
        }
        .status {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 18px;
            font-weight: bold;
        }
        .disconnected {
            background: #d32f2f;
        }
        .connected {
            background: #388e3c;
        }
        button {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            margin-bottom: 10px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        .connect-btn {
            background: #2196f3;
            color: white;
        }
        .disconnect-btn {
            background: #f44336;
            color: white;
        }
        .clear-btn {
            background: #757575;
            color: white;
        }
        #messages {
            background: #2a2a2a;
            border-radius: 8px;
            padding: 15px;
            height: 400px;
            overflow-y: auto;
            font-size: 14px;
            font-family: 'Courier New', monospace;
        }
        .message {
            margin-bottom: 10px;
            padding: 8px;
            border-radius: 4px;
            background: #333;
        }
        .message.stats {
            border-left: 4px solid #2196f3;
        }
        .message.order {
            border-left: 4px solid #4caf50;
        }
        .message.trade {
            border-left: 4px solid #ff9800;
        }
        .message.error {
            border-left: 4px solid #f44336;
        }
        .timestamp {
            color: #888;
            font-size: 12px;
        }
        .input-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            border-radius: 4px;
            border: 1px solid #444;
            background: #2a2a2a;
            color: white;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📈 Trading Exchange</h1>
        
        <div id="status" class="status disconnected">Disconnected</div>
        
        <div class="input-group">
            <label for="serverUrl">Server URL:</label>
            <input type="text" id="serverUrl" placeholder="ws://192.168.1.X:8000/ws/market">
        </div>
        
        <button class="connect-btn" onclick="connect()">🔌 Connect</button>
        <button class="disconnect-btn" onclick="disconnect()">⚡ Disconnect</button>
        <button class="clear-btn" onclick="clearMessages()">🗑️ Clear Messages</button>
        
        <h2>Live Feed</h2>
        <div id="messages"></div>
    </div>

    <script>
        let ws = null;
        let messageCount = 0;

        // Auto-fill server URL if on same device
        window.onload = function() {
            const serverUrl = document.getElementById('serverUrl');
            if (!serverUrl.value) {
                // Try to use the current host
                const host = window.location.hostname || 'localhost';
                serverUrl.value = `ws://${host}:8000/ws/market`;
            }
        };

        function connect() {
            const url = document.getElementById('serverUrl').value;
            
            if (!url) {
                alert('Please enter a server URL');
                return;
            }

            addMessage('Connecting to ' + url, 'system');
            
            ws = new WebSocket(url);
            
            ws.onopen = function() {
                document.getElementById('status').textContent = 'Connected';
                document.getElementById('status').className = 'status connected';
                addMessage('Connected to trading exchange!', 'system');
            };
            
            ws.onmessage = function(event) {
                const data = JSON.parse(event.data);
                messageCount++;
                
                let messageType = 'stats';
                let messageText = '';
                
                if (data.type === 'stats_update') {
                    messageText = `Stats: ${data.stats.total_trades} trades | Volume: ${data.stats.total_volume}`;
                } else if (data.type === 'order_submitted') {
                    messageType = 'order';
                    const order = data.order;
                    messageText = `Order: ${order.side} ${order.quantity} ${order.symbol} @ $${order.price}`;
                } else if (data.type === 'trade_executed') {
                    messageType = 'trade';
                    const trade = data.trade;
                    messageText = `Trade: ${trade.quantity} ${trade.symbol} @ $${trade.price}`;
                } else {
                    messageText = JSON.stringify(data, null, 2);
                }
                
                addMessage(messageText, messageType);
            };
            
            ws.onerror = function(error) {
                addMessage('Connection error', 'error');
            };
            
            ws.onclose = function() {
                document.getElementById('status').textContent = 'Disconnected';
                document.getElementById('status').className = 'status disconnected';
                addMessage('Disconnected from server', 'system');
                ws = null;
            };
        }

        function disconnect() {
            if (ws) {
                ws.close();
                ws = null;
            }
        }

        function clearMessages() {
            document.getElementById('messages').innerHTML = '';
            messageCount = 0;
        }

        function addMessage(text, type) {
            const messagesDiv = document.getElementById('messages');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message ' + type;
            
            const now = new Date();
            const timestamp = now.toLocaleTimeString();
            
            messageDiv.innerHTML = `
                <div class="timestamp">${timestamp} (#${messageCount})</div>
                <div>${text}</div>
            `;
            
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
            
            // Keep only last 50 messages for performance
            while (messagesDiv.children.length > 50) {
                messagesDiv.removeChild(messagesDiv.firstChild);
            }
        }
    </script>
</body>
</html>
