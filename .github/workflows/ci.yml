name: CI

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpp:
    name: C++ ${{ matrix.build }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
        build: [Debug, Release]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - run: python -m pip install cmake ninja
      - name: Configure and build
        run: |
          cmake -S cpp -B build/ci -G Ninja -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=${{ matrix.build }} -DLOBX_SANITIZE=${{ matrix.build == 'Debug' && 'ON' || 'OFF' }} -DLOBX_WERROR=ON
          cmake --build build/ci
      - run: ctest --test-dir build/ci --output-on-failure
      - name: Verify workload hashes and benchmark startup
        if: matrix.build == 'Release'
        run: |
          python bench/generate_workloads.py
          git diff --exit-code bench/workload_manifest.json
          python bench/check_cpp_results.py build/ci/lobx_replay --ladder vector
          python bench/check_cpp_results.py build/ci/lobx_replay --ladder map
          ./build/ci/lobx_bench --benchmark_filter=/workload/ --benchmark_min_time=0.01s

  python:
    name: Python ${{ matrix.python }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
        python: ['3.14']
        include:
          - os: ubuntu-24.04
            python: '3.10'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
            requirements-test.txt
      - name: Install dependencies and build the extension
        run: |
          python -m pip install -r requirements.txt -r requirements-test.txt ninja
          python -m pip install -e .
          python -c "from lobx import TradingEngine; assert TradingEngine().backend == 'cpp'"
      - name: Test the Python backend
        run: python -m pytest tests/ -q
        env:
          LOBX_BACKEND: python
      - name: Test the C++ backend
        run: python -m pytest tests/ -q
        env:
          LOBX_BACKEND: cpp
      - name: Compare the backends
        run: |
          python bench/generate_workloads.py
          git diff --exit-code bench/workload_manifest.json
          python bench/differential.py random --ops 200000 --seed 7
          python bench/differential.py workloads
          python bench/differential.py session

  python-only:
    name: Python fallback without the extension
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt
      - run: python -m pip install -r requirements.txt -r requirements-test.txt
      - name: Test fallback with an empty backend variable
        run: |
          python -c "from lobx import _native; assert not _native.AVAILABLE"
          python -m pytest tests/ -q
        env:
          LOBX_BACKEND: ""
